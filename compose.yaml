name: coffee-order-system

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffee_order}
      MYSQL_USER: ${MYSQL_USER:-coffee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coffee-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
