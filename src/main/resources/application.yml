spring:
  application:
    name: coffee-order-system
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET @@SESSION.innodb_lock_wait_timeout=2, @@SESSION.time_zone='+00:00'"
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
    mapper:
      allow-coercion-of-scalars: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

coffee-order:
  order:
    create:
      retry:
        max-attempts: 3
        initial-backoff: 50ms
        jitter-factor: 0.2
  point:
    charge:
      retry:
        max-attempts: 3
        initial-backoff: 50ms
        jitter-factor: 0.2
  outbox:
    publisher:
      enabled: false
      poll-interval: 1s
      batch-size: 10
      max-concurrency: 10
      http-call-timeout: 5s
      lease-timeout: 30s
      max-attempts: 6
      initial-backoff: 1s
      jitter-factor: 0.2
      data-platform-base-url: ""
