spring:
  application:
    name: coffee-order-system
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET @@SESSION.innodb_lock_wait_timeout=2, @@SESSION.time_zone='+00:00'"
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
    mapper:
      allow-coercion-of-scalars: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
